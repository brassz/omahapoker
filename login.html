<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Login — CLUBEDEJOGOSCAIPIRA</title>
<link rel="stylesheet" href="css/theme-bacatela.css?v=11">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;
}
.shell{
  width:min(420px,100%);
  background:#0a0614;
  border:2px solid #17c8ff;
  border-radius:18px;
  padding:22px 18px 18px;
  box-shadow:0 0 24px #17c8ff88,0 18px 40px #000a;
  animation:rise .45s ease both, clubNeonGlow 1.6s ease-in-out infinite;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.club-logo{
  width:96px;height:96px;object-fit:contain;display:block;margin:0 auto 8px;
  animation:clubLogoNeon 2.8s ease-in-out infinite;
}
.brand{
  text-align:center;margin:0 0 4px;
  font-size:clamp(20px,5.6vw,30px);line-height:1.15;
  word-break:normal;
  overflow-wrap:normal;
  letter-spacing:1px;
}
.brand .brand-line{
  display:inline-block;
  white-space:nowrap;
}
.sub{
  text-align:center;color:#fff;font-weight:1000;font-size:13px;margin:0 0 16px;
}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.tab{
  border:2px solid #fff6;border-radius:10px;padding:10px;
  font-weight:900;cursor:pointer;color:#120018;
  background:linear-gradient(90deg,#17c8ff,#ff4fd8,#a78bfa);
  background-size:200% 100%;
  animation:clubRainbowShift 3.5s ease infinite;
  box-shadow:0 0 10px #ff4fd855;
}
.tab.active{
  background:linear-gradient(90deg,#ffd91a,#5cff1a,#17c8ff,#ff4fd8);
  background-size:220% 100%;
  animation:clubRainbowShift 2.6s linear infinite;
  border-color:#fff;
  box-shadow:0 0 18px #ffd91a88;
  color:#120018;
}
label{display:block;font-size:12px;font-weight:800;margin:10px 0 4px;color:var(--muted)}
input{
  width:100%;border-radius:10px;padding:12px 11px;
  font-size:15px;font-weight:700;outline:none;
  background:#090614;color:#fff;border:1px solid #554;
}
input:focus{border-color:#17c8ff;box-shadow:0 0 0 2px #17c8ff55}
.btn{
  width:100%;margin-top:14px;border-radius:12px;
  padding:13px;font-size:16px;font-weight:900;cursor:pointer;color:#120018;
  background:linear-gradient(90deg,#17c8ff,#ff4fd8,#ffd91a,#5cff1a,#ff8c15,#a78bfa,#17c8ff);
  background-size:240% 100%;
  animation:clubRainbowShift 2.8s linear infinite;
  border:2px solid #fff;box-shadow:0 0 18px #ff4fd8aa;
}
.btn:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;margin-top:10px;text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
.msg.error{color:var(--red)}
.msg.ok{color:var(--green)}
.note{
  margin-top:12px;text-align:center;font-size:11px;color:#7af0ff;
  line-height:1.4;border-top:2px solid #17c8ff;padding-top:10px;font-weight:800;
  text-shadow:0 0 10px #17c8ff88;
}
.hidden{display:none}
.terms-box{
  margin-top:12px;padding:10px 12px;border-radius:12px;background:#060912;
  border:1px solid #334;
}
.terms-check{
  display:flex;gap:10px;align-items:flex-start;cursor:pointer;
  font-size:12px;font-weight:800;color:#d8e7ff;line-height:1.4;
}
.terms-check input{
  width:18px;height:18px;margin-top:2px;flex:0 0 auto;accent-color:#5cff1a;
  cursor:pointer;
}
.terms-check a{
  color:#7af0ff;text-decoration:underline;cursor:pointer;font-weight:900;
}
.terms-actions{margin-top:8px}
.terms-actions button{
  width:100%;border:0;border-radius:10px;padding:10px;font-weight:900;cursor:pointer;
  color:#00131b;background:linear-gradient(180deg,#0284c7,#17c8ff);border:2px solid #7dd3fc;
  font-size:12px;
}
.rules-modal{
  display:none;position:fixed;inset:0;z-index:10000;background:#000c;
  padding:14px;overflow:auto;align-items:flex-start;justify-content:center;
}
.rules-modal.open{display:flex}
.rules-card{
  width:min(560px,100%);margin:12px auto;background:#0a0614;color:#fff;
  border:2px solid #17c8ff;border-radius:16px;padding:16px 14px 14px;
  box-shadow:0 0 24px #17c8ff66,0 18px 40px #000a;max-height:min(88vh,720px);
  display:flex;flex-direction:column;
}
.rules-card h2{
  margin:0 0 10px;text-align:center;font-size:18px;
}
.rules-body{
  overflow:auto;flex:1;padding:4px 2px 8px;font-size:13px;line-height:1.5;
  color:#d8e7ff;font-weight:700;
}
.rules-body h3{margin:12px 0 6px;color:#ffd91a;font-size:14px}
.rules-body h3:first-child{margin-top:0}
.rules-body ul{margin:6px 0 8px;padding-left:18px}
.rules-body li{margin:4px 0}
.rules-body p{margin:6px 0}
.rules-body .warn{
  margin-top:12px;padding:10px;border-radius:10px;background:#2a0a0a;
  border:1px solid #ff6262;color:#ffb4b4;font-weight:900;
}
.rules-close{
  width:100%;margin-top:10px;border:0;border-radius:10px;padding:12px;
  font-weight:900;cursor:pointer;color:#fff;background:#334;border:2px solid #556;
}
</style>
</head>
<body>
  <main class="shell">
    <img class="club-logo" alt="CLUBEDEJOGOSCAIPIRA" src="assets/logos/club.png" onerror="this.onerror=null;this.src='assets/logos/club.svg'">
    <h1 class="brand club-rainbow"><span class="brand-line">CLUBEDEJOGOS</span><span class="brand-line">CAIPIRA</span></h1>
    <p class="sub">Entre para acessar o lobby de jogos</p>

    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button">ENTRAR</button>
      <button class="tab" id="tabSignup" type="button">CRIAR CONTA</button>
    </div>

    <form id="authForm" autocomplete="on">
      <div id="nameField" class="hidden">
        <label for="displayName">Nome</label>
        <input id="displayName" name="displayName" type="text" maxlength="40" placeholder="Como quer aparecer">
      </div>

      <div id="phoneField" class="hidden">
        <label for="phone">Celular</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric" maxlength="16" placeholder="(11) 99999-9999" autocomplete="tel">
      </div>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required placeholder="voce@email.com" autocomplete="email">

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" required minlength="6" placeholder="mínimo 6 caracteres" autocomplete="current-password">

      <div id="termsField" class="terms-box hidden">
        <label class="terms-check">
          <input type="checkbox" id="termsAccept" name="termsAccept">
          <span>
            Li e aceito as
            <a href="#" id="openTermsLink">regras da plataforma</a>.
          </span>
        </label>
        <div class="terms-actions">
          <button type="button" id="openRulesBtn">VER REGRAS DO CLUBE</button>
        </div>
      </div>

      <button class="btn" id="submitBtn" type="submit">ENTRAR NO CLUBE</button>
      <div class="msg" id="msg"></div>
    </form>

    <p class="note" id="refNote">Omaha5 · Crep · Bacatela · Chuva de Prêmios · Roleta · Ponto Maior · Ronda · Caipira · 21</p>
  </main>

  <div class="rules-modal" id="rulesModal" aria-hidden="true">
    <div class="rules-card" role="dialog" aria-labelledby="rulesTitle">
      <h2 id="rulesTitle" class="club-rainbow">REGRAS DO CLUBE</h2>
      <div class="rules-body" id="rulesBody"></div>
      <button type="button" class="rules-close" id="rulesClose">FECHAR</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=7"></script>
  <script src="js/auth.js?v=21"></script>
  <script>
  let mode = 'login';
  const $ = (id) => document.getElementById(id);
  const msg = $('msg');
  const submitBtn = $('submitBtn');
  const referralCode = (typeof omahaAuth !== 'undefined' && omahaAuth.getStoredReferralCode)
    ? omahaAuth.getStoredReferralCode()
    : '';
  if (referralCode) {
    $('refNote').textContent = `Indicação ativa: ${referralCode}. Ao criar conta, você fica vinculado ao gerente.`;
  }

  const PLATFORM_RULES_HTML = `
    <h3>Termos de uso — CLUBEDEJOGOSCAIPIRA</h3>
    <p>Ao criar uma conta e marcar <b>Li e aceito</b>, você declara que leu, compreendeu e concorda com estas regras.</p>
    <ul>
      <li>O acesso é pessoal e intransferível. Não compartilhe sua senha.</li>
      <li>Os créditos do clube são de uso exclusivo nesta plataforma e não possuem valor de moeda oficial fora do ambiente do clube, salvo política interna de saque/depósito informada na carteira.</li>
      <li>Depósitos via PIX e envio de comprovante seguem o fluxo da carteira. O crédito só é liberado após conferência.</li>
      <li>Saques solicitados pela carteira seguem análise e o prazo informado no clube.</li>
      <li>É proibido fraude, trapaça, uso de bots, exploração de bugs, múltiplas contas para obter vantagem indevida ou qualquer conduta que prejudique o clube ou outros jogadores.</li>
      <li>Em caso de falha de conexão, o resultado válido é o registrado pelo servidor/sistema no momento da aposta.</li>
      <li>As regras e o modo de cada jogo ficam disponíveis dentro de cada título (botão “Como jogar / Regras”).</li>
      <li>Dúvidas, comprovantes e suporte: use o canal de WhatsApp indicado na carteira.</li>
    </ul>
    <div class="warn">
      ATENÇÃO: em caso de trapaça, fraude ou irregularidade, o clube poderá <b>bloquear o saldo</b>, suspender saques e/ou encerrar a conta, sem prejuízo de outras medidas.
    </div>
    <p style="margin-top:10px">Se não concordar com estes termos, não crie a conta e não utilize a plataforma.</p>
  `;

  function openRules() {
    $('rulesBody').innerHTML = PLATFORM_RULES_HTML;
    $('rulesModal').classList.add('open');
    $('rulesModal').setAttribute('aria-hidden', 'false');
  }
  function closeRules() {
    $('rulesModal').classList.remove('open');
    $('rulesModal').setAttribute('aria-hidden', 'true');
  }

  function onlyDigits(v){ return String(v || '').replace(/\D/g, ''); }

  function formatPhone(v){
    const d = onlyDigits(v).slice(0, 11);
    if (d.length <= 2) return d;
    if (d.length <= 7) return `(${d.slice(0,2)}) ${d.slice(2)}`;
    if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
    return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  }

  function setMode(next) {
    mode = next;
    const signup = mode === 'signup';
    $('tabLogin').classList.toggle('active', !signup);
    $('tabSignup').classList.toggle('active', signup);
    $('nameField').classList.toggle('hidden', !signup);
    $('phoneField').classList.toggle('hidden', !signup);
    $('termsField').classList.toggle('hidden', !signup);
    $('phone').required = signup;
    if (!signup) $('termsAccept').checked = false;
    $('password').autocomplete = signup ? 'new-password' : 'current-password';
    submitBtn.textContent = signup ? 'CRIAR CONTA' : 'ENTRAR NO CLUBE';
    msg.textContent = '';
    msg.className = 'msg';
  }

  $('tabLogin').onclick = () => setMode('login');
  $('tabSignup').onclick = () => setMode('signup');
  if (referralCode) setMode('signup');
  $('openRulesBtn').onclick = () => openRules();
  $('openTermsLink').onclick = (e) => {
    e.preventDefault();
    openRules();
  };
  $('rulesClose').onclick = closeRules;
  $('rulesModal').addEventListener('click', (e) => {
    if (e.target.id === 'rulesModal') closeRules();
  });

  $('phone').addEventListener('input', () => {
    const el = $('phone');
    el.value = formatPhone(el.value);
    try { el.setSelectionRange(el.value.length, el.value.length); } catch (_) {}
  });

  function goAfterLogin(profile) {
    if (typeof omahaAuth?.routeAfterLogin === 'function') {
      return omahaAuth.routeAfterLogin(profile);
    }
    if (profile && profile.is_admin) location.replace('admin.html');
    else if (profile && profile.is_manager) location.replace('gerente.html');
    else location.replace('lobby.html');
  }

  async function goAfterAuth() {
    if (!window.omahaAuth) throw new Error('Auth não carregou. Atualize a página (Ctrl+F5).');
    const session = await omahaAuth.getSession();
    if (!session?.user) return;
    const profile = await omahaAuth.ensureProfile(session.user);
    await goAfterLogin(profile);
  }

  (async () => {
    try { await goAfterAuth(); } catch (_) {}
  })();

  $('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    msg.textContent = mode === 'signup' ? 'Criando conta...' : 'Entrando...';
    submitBtn.disabled = true;

    const email = $('email').value.trim();
    const password = $('password').value;
    const displayName = $('displayName').value.trim();
    const phone = onlyDigits($('phone').value);

    try {
      if (mode === 'signup') {
        if (!displayName) throw new Error('Informe seu nome.');
        if (phone.length < 10 || phone.length > 11) {
          throw new Error('Informe um celular válido com DDD.');
        }
        if (!$('termsAccept').checked) {
          throw new Error('Você precisa ler e aceitar as regras da plataforma para criar a conta.');
        }
        const data = await omahaAuth.signUp({ email, password, displayName, phone });
        if (!data.session) {
          msg.className = 'msg ok';
          msg.textContent = 'Conta criada. Faça login para continuar.';
          setMode('login');
          return;
        }
      } else {
        await omahaAuth.signIn({ email, password });
      }
      await goAfterAuth();
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = err?.message || 'Não foi possível autenticar.';
    } finally {
      submitBtn.disabled = false;
    }
  });
  </script>
</body>
</html>
