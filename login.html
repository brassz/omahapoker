<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Login — CLUBEDEJOGOSCAIPIRA</title>
<link rel="stylesheet" href="css/theme-bacatela.css">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;
}
.shell{
  width:min(420px,100%);
  background:#080812;
  border:2px solid var(--pink);
  border-radius:18px;
  padding:22px 18px 18px;
  box-shadow:0 0 24px #ff2bd666,0 18px 40px #000a;
  animation:rise .45s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.club-logo{
  width:96px;height:96px;object-fit:contain;display:block;margin:0 auto 8px;
  filter:drop-shadow(0 0 16px #17c8ff88);
}
.brand{
  text-align:center;margin:0 0 4px;
  font-size:clamp(24px,7vw,34px);line-height:1.05;
  word-break:break-word;
}
.sub{
  text-align:center;color:#fff;font-weight:1000;font-size:13px;margin:0 0 16px;
  text-shadow:0 0 12px var(--gold);
}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.tab{
  border:2px solid var(--violet);border-radius:10px;padding:10px;
  font-weight:900;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#6726d9,#331173);
  box-shadow:0 0 10px #9c34ff55;
}
.tab.active{
  background:linear-gradient(180deg,#ff2bd6,#9c34ff);
  border-color:#ff9be0;
  box-shadow:0 0 16px #ff2bd688;
}
label{display:block;font-size:12px;font-weight:800;margin:10px 0 4px;color:var(--muted)}
input{
  width:100%;border-radius:10px;padding:12px 11px;
  font-size:15px;font-weight:700;outline:none;
  background:#090b14;color:#fff;border:1px solid #445;
}
input:focus{border-color:var(--blue);box-shadow:0 0 0 2px #17c8ff55}
.btn{
  width:100%;margin-top:14px;border-radius:12px;
  padding:13px;font-size:16px;font-weight:900;cursor:pointer;color:#fff;
  background:linear-gradient(90deg,#1f7a00,#58df00,#1f7a00);
  border:2px solid #9dff76;box-shadow:0 0 16px #62ff00;
}
.btn:disabled{opacity:.6;cursor:wait}
.msg{min-height:20px;margin-top:10px;text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
.msg.error{color:var(--red)}
.msg.ok{color:var(--green)}
.note{
  margin-top:12px;text-align:center;font-size:11px;color:#ffe700;
  line-height:1.4;border-top:2px solid var(--pink);padding-top:10px;font-weight:800;
}
.hidden{display:none}
</style>
</head>
<body>
  <main class="shell">
    <img class="club-logo" alt="CLUBEDEJOGOSCAIPIRA" src="assets/logos/club.png" onerror="this.onerror=null;this.src='assets/logos/club.svg'">
    <h1 class="brand club-rainbow">CLUBEDEJOGOSCAIPIRA</h1>
    <p class="sub">Entre para acessar o lobby de jogos</p>

    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button">ENTRAR</button>
      <button class="tab" id="tabSignup" type="button">CRIAR CONTA</button>
    </div>

    <form id="authForm" autocomplete="on">
      <div id="nameField" class="hidden">
        <label for="displayName">Nome</label>
        <input id="displayName" name="displayName" type="text" maxlength="40" placeholder="Como quer aparecer">
      </div>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required placeholder="voce@email.com" autocomplete="email">

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" required minlength="6" placeholder="mínimo 6 caracteres" autocomplete="current-password">

      <button class="btn" id="submitBtn" type="submit">ENTRAR NO CLUBE</button>
      <div class="msg" id="msg"></div>
    </form>

    <p class="note">Omaha · Crep · Bacatela · Ronda · Caipira</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=3"></script>
  <script src="js/auth.js?v=3"></script>
  <script>
  let mode = 'login';
  const $ = (id) => document.getElementById(id);
  const msg = $('msg');
  const submitBtn = $('submitBtn');

  function setMode(next) {
    mode = next;
    const signup = mode === 'signup';
    $('tabLogin').classList.toggle('active', !signup);
    $('tabSignup').classList.toggle('active', signup);
    $('nameField').classList.toggle('hidden', !signup);
    $('password').autocomplete = signup ? 'new-password' : 'current-password';
    submitBtn.textContent = signup ? 'CRIAR CONTA' : 'ENTRAR NO CLUBE';
    msg.textContent = '';
    msg.className = 'msg';
  }

  $('tabLogin').onclick = () => setMode('login');
  $('tabSignup').onclick = () => setMode('signup');

  function goAfterLogin(profile) {
    if (typeof omahaAuth?.routeAfterLogin === 'function') {
      return omahaAuth.routeAfterLogin(profile);
    }
    // fallback se o navegador ainda estiver com cache antigo do auth.js
    if (profile && profile.is_admin) location.replace('admin.html');
    else location.replace('lobby.html');
  }

  async function goAfterAuth() {
    if (!window.omahaAuth) throw new Error('Auth não carregou. Atualize a página (Ctrl+F5).');
    const session = await omahaAuth.getSession();
    if (!session?.user) return;
    const profile = await omahaAuth.ensureProfile(session.user);
    await goAfterLogin(profile);
  }

  (async () => {
    try { await goAfterAuth(); } catch (_) {}
  })();

  $('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    msg.textContent = mode === 'signup' ? 'Criando conta...' : 'Entrando...';
    submitBtn.disabled = true;

    const email = $('email').value.trim();
    const password = $('password').value;
    const displayName = $('displayName').value.trim();

    try {
      if (mode === 'signup') {
        const data = await omahaAuth.signUp({ email, password, displayName });
        if (!data.session) {
          msg.className = 'msg ok';
          msg.textContent = 'Conta criada. Faça login para continuar.';
          setMode('login');
          return;
        }
      } else {
        await omahaAuth.signIn({ email, password });
      }
      await goAfterAuth();
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = err?.message || 'Não foi possível autenticar.';
    } finally {
      submitBtn.disabled = false;
    }
  });
  </script>
</body>
</html>
