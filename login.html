<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Login — Omaha 5 Cartas</title>
<style>
:root{
  --text:#f7fff9;
  --muted:#d7e7ff;
  --gold:#fff36a;
  --line:#75e7ff;
  --danger:#ff8a8a;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 12% 8%,#ff4d6d 0,transparent 24%),
    radial-gradient(circle at 88% 10%,#5b5bf7 0,transparent 26%),
    radial-gradient(circle at 15% 88%,#00c98d 0,transparent 25%),
    radial-gradient(circle at 88% 86%,#ffb000 0,transparent 28%),
    linear-gradient(145deg,#27105a,#0c6280 48%,#3c146c);
  background-attachment:fixed;
  display:grid;place-items:center;padding:16px;
}
.shell{
  width:min(420px,100%);
  background:linear-gradient(180deg,#ffffff18,#00000022);
  border:2px solid var(--line);
  border-radius:20px;
  padding:22px 18px 18px;
  box-shadow:0 18px 40px #0007;
  animation:rise .45s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.brand{
  text-align:center;margin:0 0 4px;
  font-size:clamp(28px,7vw,36px);letter-spacing:1px;
  color:var(--gold);text-shadow:0 2px 0 #a21caf,0 0 16px #ff4fd8;
}
.sub{text-align:center;color:#fff;font-weight:700;font-size:12px;margin:0 0 16px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.tab{
  border:2px solid #ffd2ee;border-radius:10px;padding:10px;
  font-weight:900;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#5b21b6,#312e81);
}
.tab.active{background:linear-gradient(135deg,#ff2f92,#8b5cf6)}
label{display:block;font-size:12px;font-weight:800;margin:10px 0 4px;color:#e0f2fe}
input{
  width:100%;border:0;border-radius:10px;padding:12px 11px;
  font-size:15px;font-weight:700;outline:none;
  background:#0b1b33;color:#fff;border:2px solid #38bdf8;
}
input:focus{border-color:#fff36a;box-shadow:0 0 0 3px #fff36a44}
.btn{
  width:100%;margin-top:14px;border:2px solid #ffd2ee;border-radius:12px;
  padding:13px;font-size:16px;font-weight:900;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,#00b96b,#00a8e8);
}
.btn:disabled{opacity:.6;cursor:wait}
.msg{
  min-height:20px;margin-top:10px;text-align:center;
  font-size:13px;font-weight:800;color:var(--muted);
}
.msg.error{color:var(--danger)}
.msg.ok{color:#86efac}
.note{margin-top:12px;text-align:center;font-size:11px;color:#c7d2fe;line-height:1.4}
.hidden{display:none}
</style>
</head>
<body>
  <main class="shell">
    <h1 class="brand">♠ OMAHA 5 CARTAS ♥</h1>
    <p class="sub">Entre para salvar créditos e histórico no servidor</p>

    <div class="tabs">
      <button class="tab active" id="tabLogin" type="button">ENTRAR</button>
      <button class="tab" id="tabSignup" type="button">CRIAR CONTA</button>
    </div>

    <form id="authForm" autocomplete="on">
      <div id="nameField" class="hidden">
        <label for="displayName">Nome</label>
        <input id="displayName" name="displayName" type="text" maxlength="40" placeholder="Como quer aparecer">
      </div>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" required placeholder="voce@email.com" autocomplete="email">

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" required minlength="6" placeholder="mínimo 6 caracteres" autocomplete="current-password">

      <button class="btn" id="submitBtn" type="submit">ENTRAR NO JOGO</button>
      <div class="msg" id="msg"></div>
    </form>

    <p class="note">Simulador de estudo — créditos fictícios, sem dinheiro real.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
  let mode = 'login';
  const $ = (id) => document.getElementById(id);
  const msg = $('msg');
  const submitBtn = $('submitBtn');

  function setMode(next) {
    mode = next;
    const signup = mode === 'signup';
    $('tabLogin').classList.toggle('active', !signup);
    $('tabSignup').classList.toggle('active', signup);
    $('nameField').classList.toggle('hidden', !signup);
    $('password').autocomplete = signup ? 'new-password' : 'current-password';
    submitBtn.textContent = signup ? 'CRIAR CONTA' : 'ENTRAR NO JOGO';
    msg.textContent = '';
    msg.className = 'msg';
  }

  $('tabLogin').onclick = () => setMode('login');
  $('tabSignup').onclick = () => setMode('signup');

  (async () => {
    try {
      const session = await omahaAuth.getSession();
      if (session?.user) location.replace('game.html');
    } catch (_) {}
  })();

  $('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.className = 'msg';
    msg.textContent = mode === 'signup' ? 'Criando conta...' : 'Entrando...';
    submitBtn.disabled = true;

    const email = $('email').value.trim();
    const password = $('password').value;
    const displayName = $('displayName').value.trim();

    try {
      if (mode === 'signup') {
        const data = await omahaAuth.signUp({ email, password, displayName });
        if (!data.session) {
          msg.className = 'msg ok';
          msg.textContent = 'Conta criada. Faça login para continuar.';
          setMode('login');
          return;
        }
      } else {
        await omahaAuth.signIn({ email, password });
      }
      location.replace('game.html');
    } catch (err) {
      msg.className = 'msg error';
      msg.textContent = err?.message || 'Não foi possível autenticar.';
    } finally {
      submitBtn.disabled = false;
    }
  });
  </script>
</body>
</html>
