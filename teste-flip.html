<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste Flip</title>
<style>
:root{--bg:#07120c;--gold:#ffd65a}
*{box-sizing:border-box}
body{margin:0;background:#1a1a2e;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:20px}
h1{color:var(--gold)}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:500px;width:90%}

/* ── Carta base ── */
.playing-card{
  position:relative;background:#fff;color:#111;
  border-radius:8px;min-height:90px;height:90px;
  border:1.5px solid #c8c8c8;box-shadow:0 3px 8px #0007;
  font-family:Georgia,serif;font-weight:700;
  overflow:hidden;padding:0;
}
.playing-card .corner{position:absolute;top:3px;left:4px;display:flex;flex-direction:column;align-items:center;line-height:1;z-index:1}
.playing-card .corner .rank{font-size:14px;font-weight:800}
.playing-card .corner .pip{font-size:13px;margin-top:1px}
.playing-card .center-suit{position:absolute;inset:0;display:grid;place-items:center;font-size:30px}
.playing-card.red{color:#d40000}
.playing-card.back{
  background:repeating-linear-gradient(45deg,#1a3a6e 0 6px,#24508f 6px 12px);
  color:transparent;border-color:#0f274d;
}
.playing-card.back::after{
  content:'';position:absolute;inset:5px;border:2px solid #6ea0d8;border-radius:5px;
  background:radial-gradient(circle,#2c5fa0,#163a6e 70%);
}

/* ══ ANIMAÇÃO DE VIRADA ══ */
.flipSlot{position:relative;z-index:10;perspective:800px}
.flipSlot .flipWrap{
  position:relative;border-radius:8px;
  transform-style:preserve-3d;
  transform-origin:center center;
  height:90px; /* mesma altura da carta */
}
.flipSlot .flipWrap .playing-card{animation:none!important}
.flipSlot .flipFace{position:absolute;inset:0;border-radius:8px;overflow:hidden}
.flipSlot .flipFace .playing-card{height:100%;min-height:0;width:100%}
.flipSlot .flipFace.hidden{visibility:hidden}

.flipSlot.turn .flipWrap{animation:omTurn 2.5s ease-in-out both}
.flipSlot.turn::after{
  content:'';position:absolute;inset:0;border-radius:10px;pointer-events:none;
  animation:omGlow .7s ease-out 2.1s both;
}
.flipSlot.river .flipWrap{animation:omRiver 4s ease-in-out both}
.flipSlot.river::after{
  content:'';position:absolute;inset:0;border-radius:10px;pointer-events:none;
  animation:omGlow .8s ease-out 3.5s both;
}

@keyframes omTurn{
  0%   {transform:translateY(0) rotateY(0) scale(1)}
  15%  {transform:translateY(-24px) rotateY(0) scale(1.2)}
  35%  {transform:translateY(-24px) rotateY(80deg) scale(1.2)}
  50%  {transform:translateY(-24px) rotateY(90deg) scale(1.22)}
  65%  {transform:translateY(-24px) rotateY(100deg) scale(1.2)}
  85%  {transform:translateY(-6px) rotateY(175deg) scale(1.04)}
  92%  {transform:translateY(-2px) rotateY(183deg) scale(1.01)}
  100% {transform:translateY(0) rotateY(180deg) scale(1)}
}
@keyframes omRiver{
  0%   {transform:translateY(0) rotateY(0) scale(1)}
  5%   {transform:translateY(-4px) rotateY(0) rotateZ(5deg) scale(1.06)}
  10%  {transform:translateY(-4px) rotateY(0) rotateZ(-5deg) scale(1.06)}
  15%  {transform:translateY(-3px) rotateY(0) rotateZ(4deg) scale(1.04)}
  20%  {transform:translateY(-3px) rotateY(0) rotateZ(-4deg) scale(1.04)}
  25%  {transform:translateY(0) rotateY(0) rotateZ(0) scale(1)}
  35%  {transform:translateY(-32px) rotateY(0) scale(1.3)}
  50%  {transform:translateY(-32px) rotateY(75deg) scale(1.3)}
  60%  {transform:translateY(-32px) rotateY(90deg) scale(1.32)}
  70%  {transform:translateY(-32px) rotateY(105deg) scale(1.3)}
  85%  {transform:translateY(-8px) rotateY(174deg) scale(1.06)}
  93%  {transform:translateY(-2px) rotateY(183deg) scale(1.01)}
  100% {transform:translateY(0) rotateY(180deg) scale(1)}
}
@keyframes omGlow{
  0%  {box-shadow:0 0 0 0 #ffd65a00}
  50% {box-shadow:0 0 0 5px #ffd65a,0 0 30px 12px #ffd65acc,0 0 60px 20px #ffd65a44}
  100%{box-shadow:0 0 0 0 #ffd65a00}
}

/* botões */
button{border:0;border-radius:10px;padding:14px 24px;font-weight:900;font-size:16px;cursor:pointer;color:#fff;margin:4px}
#btnTurn{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
#btnRiver{background:linear-gradient(135deg,#00b8d9,#22c55e)}
#btnReset{background:#555}
</style>
</head>
<body>
<h1>♠ Teste de Virada ♥</h1>
<p style="color:#aaa;text-align:center">Clique TURN ou RIVER pra ver a carta virar no slot correspondente</p>
<div class="board" id="board"></div>
<div>
  <button id="btnTurn">VIRAR TURN</button>
  <button id="btnRiver">VIRAR RIVER</button>
  <button id="btnReset">RESET</button>
</div>

<script>
const cards = [
  {r:'A',s:'♠',red:false}, {r:'K',s:'♥',red:true}, {r:'Q',s:'♦',red:true},
  {r:'J',s:'♣',red:false}, {r:'10',s:'♥',red:true}
];

function cardHtml(c, hidden){
  if(hidden || !c) return '<div class="playing-card back"></div>';
  const col = c.red ? 'red' : 'black';
  return `<div class="playing-card ${col}">
    <div class="corner"><span class="rank">${c.r}</span><span class="pip">${c.s}</span></div>
    <div class="center-suit">${c.s}</div>
  </div>`;
}

let turnRevealed = false, riverRevealed = false;

function renderBoard(flipIdx, flipKind){
  const board = document.getElementById('board');
  board.innerHTML = [0,1,2,3,4].map(i => {
    // Flop: always visible (0,1,2)
    if(i < 3) return cardHtml(cards[i]);
    // Turn slot (3)
    if(i === 3){
      if(flipIdx === 3){
        return `<div class="flipSlot ${flipKind}" data-flip="3">
          <div class="flipWrap">
            <div class="flipFace flipFaceBack">${cardHtml(null,true)}</div>
            <div class="flipFace flipFaceFront hidden">${cardHtml(cards[3])}</div>
          </div>
        </div>`;
      }
      if(turnRevealed) return cardHtml(cards[3]);
      return '<div class="playing-card" style="visibility:hidden"></div>';
    }
    // River slot (4)
    if(i === 4){
      if(flipIdx === 4){
        return `<div class="flipSlot ${flipKind}" data-flip="4">
          <div class="flipWrap">
            <div class="flipFace flipFaceBack">${cardHtml(null,true)}</div>
            <div class="flipFace flipFaceFront hidden">${cardHtml(cards[4])}</div>
          </div>
        </div>`;
      }
      if(riverRevealed) return cardHtml(cards[4]);
      return '<div class="playing-card" style="visibility:hidden"></div>';
    }
  }).join('');
}

function doFlip(index, kind){
  renderBoard(index, kind);
  const swapDelay = kind === 'river' ? 2400 : 1250;
  const totalDelay = kind === 'river' ? 4300 : 2800;
  const slot = document.querySelector(`.flipSlot[data-flip="${index}"]`);
  if(slot){
    setTimeout(() => {
      const back = slot.querySelector('.flipFaceBack');
      const front = slot.querySelector('.flipFaceFront');
      if(back) back.classList.add('hidden');
      if(front) front.classList.remove('hidden');
    }, swapDelay);
  }
  setTimeout(() => {
    if(index === 3) turnRevealed = true;
    if(index === 4) riverRevealed = true;
    renderBoard(-1, '');
  }, totalDelay);
}

document.getElementById('btnTurn').onclick = () => { turnRevealed = false; doFlip(3, 'turn'); };
document.getElementById('btnRiver').onclick = () => { riverRevealed = false; doFlip(4, 'river'); };
document.getElementById('btnReset').onclick = () => { turnRevealed = false; riverRevealed = false; renderBoard(-1,''); };

renderBoard(-1, '');
</script>
</body>
</html>
