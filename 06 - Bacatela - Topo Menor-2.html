<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bacatela - Nova Versão</title>
<style>
:root{--bg:#020006;--blue:#17c8ff;--red:#ff3434;--gold:#ffd91a;--green:#5cff1a;--pink:#ff2bd6;--violet:#9c34ff;--orange:#ff8c15}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#21003f 0,#090011 35%,#020006 72%);color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100vh}.app{max-width:1180px;margin:auto;padding:8px}.top{display:grid;grid-template-columns:190px 1fr 190px;gap:10px;align-items:start}.side{border-radius:18px;padding:12px;background:#060912;border:2px solid;box-shadow:0 0 18px currentColor}.playerSide{color:var(--blue)}.bankSide{color:var(--red)}.side h2{margin:0 0 10px;text-align:center;font-size:24px}.label{text-align:center;color:#d8e7ff;font-weight:700;font-size:13px}.credit{font-size:34px;text-align:center;font-weight:900;margin:6px 0 10px;text-shadow:0 0 14px currentColor}.addBtn{width:100%;background:#38c800;color:white;border:2px solid #9dff76;padding:10px;border-radius:10px;font-size:16px;font-weight:900;box-shadow:0 0 12px #4cff00}.last{margin-top:12px;border-top:1px solid #334;padding-top:10px;text-align:center}.last b{display:inline-block;margin-top:6px;font-size:30px;padding:7px 18px;border-radius:10px;border:2px solid currentColor;box-shadow:0 0 12px currentColor}.wins{text-align:center;margin-top:10px;font-weight:900}.brand{text-align:center}.title{font-size:58px;line-height:.95;font-weight:1000;letter-spacing:4px;background:linear-gradient(90deg,#00eaff,#ffe000,#58ff1c,#ff24d8,#ff7418,#00eaff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 14px #fff6;animation:rainbow 3s linear infinite}.tagline{font-weight:1000;font-size:22px;margin-top:4px;color:white;text-shadow:0 0 12px var(--gold)}@keyframes rainbow{to{background-position:300% 0}}
.resultWrap{display:grid;grid-template-columns:1fr auto 1fr;gap:5px;align-items:center;margin:5px 0}.resultBox{min-height:105px;border-radius:14px;padding:6px;text-align:center;background:#070914;border:2px solid;box-shadow:0 0 18px currentColor;position:relative;overflow:hidden}.resultBox.player{color:var(--blue)}.resultBox.bank{color:var(--red)}.resultTitle{font-size:20px;font-weight:1000;min-height:24px}.bigNumber{font-size:66px;line-height:1;font-weight:1000;text-shadow:0 0 8px #fff,0 0 20px currentColor,0 0 36px currentColor}.versus{font-size:44px;font-weight:1000;color:var(--gold);text-shadow:0 0 20px #ff8a00}.winner .bigNumber{animation:winPulse .45s infinite alternate}.winner:after{content:"★ VENCEDOR ★";position:absolute;right:8px;top:8px;font-size:12px;color:#fff;background:#ffffff22;border:1px solid #fff6;border-radius:999px;padding:4px 7px}@keyframes winPulse{from{transform:scale(1);filter:brightness(1)}to{transform:scale(1.08);filter:brightness(1.6)}}
.centerGrid{display:grid;grid-template-columns:230px minmax(0,1fr) 230px;gap:10px}.centerBoard{min-width:0}.betPanel,.historyPanel{background:#080812;border:2px solid var(--pink);border-radius:16px;padding:10px;box-shadow:0 0 14px #ff2bd655}.betPanel h3,.historyPanel h3{margin:0 0 8px;text-align:center;color:#fff}.betRow{display:grid;grid-template-columns:42px 1fr 42px;gap:6px;align-items:center}.betRow button{font-size:24px}.betValue{background:#000;border:1px solid #777;border-radius:9px;color:var(--gold);font-size:28px;font-weight:900;text-align:center;padding:8px;width:100%}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.quick button:nth-child(1){background:#167cff}.quick button:nth-child(2){background:#22a92a}.quick button:nth-child(3){background:#dc9f00}.quick button:nth-child(4){background:#8e22db}.quick button:nth-child(5){background:#d51632;grid-column:2/4}.mini{margin-top:10px;background:#12131b;border:1px solid #6f6f6f;border-radius:12px;padding:10px;text-align:center}.numbers{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:7px;border-radius:16px;background:#050812;border:2px solid #00d9ff;box-shadow:0 0 18px #00d9ff55}.num{height:43px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:1000;font-size:22px;background:linear-gradient(145deg,var(--c1),#08000c 72%);border:2px solid var(--c1);box-shadow:inset 0 0 8px #000,0 0 7px var(--c1),0 0 14px var(--c1);animation:numBlink .95s ease-in-out infinite}.num:nth-child(7n+1){--c1:#00eaff}.num:nth-child(7n+2){--c1:#ff243d}.num:nth-child(7n+3){--c1:#9c34ff}.num:nth-child(7n+4){--c1:#5cff1a}.num:nth-child(7n+5){--c1:#ffd91a}.num:nth-child(7n+6){--c1:#ff8c15}.num:nth-child(7n){--c1:#ff2bd6}.num:nth-child(3n){animation-delay:.12s}.num:nth-child(5n){animation-delay:.3s}@keyframes numBlink{0%,100%{filter:brightness(.8);transform:scale(.98)}50%{filter:brightness(1.55);transform:scale(1.02);box-shadow:inset 0 0 8px #000,0 0 8px #fff,0 0 18px var(--c1)}}.num.playerMark{outline:3px solid var(--blue);box-shadow:0 0 9px #fff,0 0 24px var(--blue)}.num.bankMark{outline:3px solid var(--red);box-shadow:0 0 9px #fff,0 0 24px var(--red)}.num.playerWin{background:radial-gradient(circle,#fff,#25d9ff 45%,#006fd6);color:#00131b;transform:scale(1.15);z-index:3;animation:winCell .35s infinite alternate}.num.bankWin{background:radial-gradient(circle,#fff,#ff6666 45%,#b40000);color:#290000;transform:scale(1.15);z-index:3;animation:winCell .35s infinite alternate}@keyframes winCell{to{filter:brightness(1.7);box-shadow:0 0 12px #fff,0 0 30px currentColor}}
.playBar{display:grid;grid-template-columns:180px 1fr 180px;gap:10px;margin-top:10px}.smallAction{background:linear-gradient(180deg,#6726d9,#331173);border:2px solid #a65eff}.play{background:linear-gradient(90deg,#1f7a00,#58df00,#1f7a00);border:2px solid #9dff76;box-shadow:0 0 16px #62ff00;font-size:27px}.sound{background:linear-gradient(180deg,#b95b00,#6b2f00);border:2px solid #ff9f32}.msg{margin:10px 0 0;padding:12px;border-radius:14px;text-align:center;background:#080a13;border:1px solid #555;font-weight:800;min-height:44px}.historyList{max-height:360px;overflow:auto}.histItem{display:grid;grid-template-columns:44px 1fr auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid #263042;font-size:12px}.histNum{font-weight:1000;border:2px solid currentColor;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center}.histP{color:var(--blue)}.histB{color:var(--red)}button{border:0;border-radius:9px;padding:9px 10px;color:white;font-weight:900;cursor:pointer}.footer{margin-top:10px;text-align:center;color:#ffe700;font-weight:900;letter-spacing:2px;border-top:2px solid #ff2bd6;padding-top:7px}.hiddenInput{width:100%;margin-top:6px;background:#090b14;color:#fff;border:1px solid #445;border-radius:8px;padding:8px}
@media(max-width:880px){.top{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;align-items:center}.side h2{grid-column:1/-1}.brand{grid-row:1}.playerSide{grid-row:2}.bankSide{grid-row:3}.centerGrid{grid-template-columns:1fr}.centerBoard{order:1}.betPanel{order:2}.historyPanel{order:3}.playBar{grid-template-columns:1fr 1.4fr 1fr;gap:5px;margin-top:6px}.playBar button{font-size:12px;padding:8px 4px}.playBar .play{font-size:15px}.playBar .play span{font-size:9px!important}.title{font-size:42px}.resultWrap{grid-template-columns:1fr 45px 1fr}.bigNumber{font-size:64px}.resultTitle{font-size:20px}.versus{font-size:42px}.num{height:36px;font-size:17px}}
@media(max-width:500px){.app{padding:5px}.title{font-size:33px}.tagline{font-size:15px}.side{grid-template-columns:1fr 1fr}.side .last{grid-column:1/-1}.credit{font-size:27px}.bigNumber{font-size:42px}.resultWrap{gap:3px;margin:3px 0}.resultBox{min-height:82px;padding:4px}.resultTitle{font-size:12px;min-height:16px}.versus{font-size:25px}.numbers{gap:3px;padding:4px}.num{height:30px;font-size:13px}.quick{grid-template-columns:repeat(3,1fr)}.quick button:nth-child(5){grid-column:auto}.play{font-size:21px}}
</style>

<style id="mobile-fit-fix">
html,body{width:100%;max-width:100%;overflow-x:hidden}
.app{width:100%;max-width:100%;padding:6px;box-sizing:border-box}
@media(max-width:600px){
  body{margin:0;overflow-x:hidden}
  .app{padding:4px}
  .title{font-size:clamp(26px,9vw,42px);line-height:1;margin:2px 0}
  .subtitle,.fake{font-size:10px;line-height:1.2;margin:3px auto}
  .top{gap:4px}
  .sidePanel{padding:5px;border-radius:10px}
  .sidePanel h2{font-size:13px;margin:2px 0}
  .creditLabel,.lastLabel,.winsLabel{font-size:8px}
  .credit{font-size:17px}
  .lastNumber{font-size:22px;padding:4px}
  .wins{font-size:14px}
  .resultCenter{gap:3px}
  .resultBox{padding:5px 3px;border-radius:10px}
  .resultBox .who{font-size:11px}
  .resultBox .bigNum{font-size:clamp(38px,13vw,60px);line-height:.95}
  .versus{font-size:26px}
  .mainGrid{grid-template-columns:76px minmax(0,1fr) 76px;gap:4px;align-items:start}
  .betPanel,.historyPanel{padding:5px;border-radius:9px}
  .betPanel h3,.historyPanel h3{font-size:9px;margin:2px 0 5px}
  .betValue{font-size:20px}
  .quick{grid-template-columns:repeat(2,1fr);gap:3px}
  .quick button{padding:5px 2px;font-size:10px}
  .numbers{gap:2px;padding:3px;border-radius:8px}
  .num{min-width:0;font-size:clamp(9px,2.85vw,13px);border-width:1px;border-radius:5px;box-shadow:0 0 4px var(--c1)}
  .historyList{max-height:240px;font-size:9px}
  .histItem{padding:3px 1px;gap:2px}
  .histNum{width:22px;height:22px;font-size:9px}
  .playBar{grid-template-columns:72px minmax(0,1fr) 72px;gap:4px;margin-top:4px}
  .playBar button{padding:7px 3px;font-size:9px;border-radius:8px}
  .playBar .play{font-size:14px;line-height:1.05;padding:9px 3px}
  .playBar .play span{font-size:8px!important}
  .msg{font-size:9px;padding:4px;margin-top:3px}
  .footer{font-size:9px;margin-top:3px}
}
@media(max-width:380px){
  .mainGrid{grid-template-columns:66px minmax(0,1fr) 66px}
  .playBar{grid-template-columns:64px minmax(0,1fr) 64px}
  .num{font-size:8.5px}
  .resultBox .bigNum{font-size:42px}
}
</style>

<style id="player-bank-compact-fix">
@media(max-width:600px){
  .top{display:grid!important;grid-template-columns:1fr 1fr!important;gap:5px!important;align-items:start!important}
  .brand{grid-column:1/-1!important;grid-row:1!important;margin-bottom:2px!important}
  .playerSide{grid-column:1!important;grid-row:2!important}
  .bankSide{grid-column:2!important;grid-row:2!important}
  .side{display:block!important;padding:6px!important;border-radius:12px!important;min-width:0!important}
  .side h2{font-size:14px!important;margin:0 0 4px!important;line-height:1.05!important}
  .side .label{font-size:9px!important;line-height:1.05!important}
  .side .credit{font-size:19px!important;margin:2px 0 4px!important;line-height:1!important}
  .side .hiddenInput{font-size:10px!important;padding:5px!important;margin-top:3px!important;height:27px!important}
  .side .addBtn{font-size:10px!important;padding:5px 3px!important;margin-top:3px!important;border-radius:7px!important}
  .side .last{margin-top:5px!important;padding-top:5px!important;border-top:1px solid #334!important}
  .side .last b{font-size:23px!important;padding:3px 10px!important;margin-top:3px!important;border-radius:7px!important}
  .side .wins{font-size:10px!important;margin-top:4px!important}
}
@media(max-width:380px){
  .side{padding:5px!important}
  .side h2{font-size:12px!important}
  .side .credit{font-size:17px!important}
  .side .last b{font-size:20px!important}
}
</style>

<style>
/* Bacatela - versão compacta para celular */
@media (max-width: 650px){
  body{font-size:12px !important}
  .app,.container,.wrap,main{padding:3px !important;margin:0 auto !important}
  h1{font-size:23px !important;margin:2px 0 !important}
  h2,h3{font-size:14px !important;margin:3px 0 !important}
  .panel,.box,.card,.bloco,.section{
    padding:4px !important;
    margin:3px 0 !important;
    border-radius:8px !important;
  }
  .grid{gap:3px !important}
  button{
    padding:6px 3px !important;
    min-height:30px !important;
    font-size:10px !important;
    border-radius:6px !important;
  }
  input,select{
    padding:5px !important;
    min-height:30px !important;
    font-size:11px !important;
  }
  table{font-size:10px !important}
  th,td{padding:3px 2px !important}
  .credit,.saldo,.value,.valor{font-size:17px !important}
  .status,.resultado{padding:5px !important;margin:3px 0 !important;font-size:11px !important}
}
</style>


<style>
/* Compactação extra somente da parte superior */
@media (max-width:650px){
  body{margin:0 !important}
  .app,.container,.wrap,main{
    padding-top:1px !important;
  }
  h1{
    margin:0 !important;
    padding:0 !important;
    line-height:1 !important;
  }
  h1 + *, .sub, .subtitle{
    margin-top:1px !important;
    margin-bottom:2px !important;
  }
  .grid:first-of-type,
  main > .panel:first-of-type,
  main > .panel:nth-of-type(2),
  .app > .panel:first-of-type,
  .app > .panel:nth-of-type(2){
    margin-top:2px !important;
    margin-bottom:2px !important;
    padding-top:2px !important;
    padding-bottom:2px !important;
    min-height:0 !important;
  }
  .grid:first-of-type > *,
  .top,.top-grid,.topGrid{
    padding-top:2px !important;
    padding-bottom:2px !important;
    min-height:0 !important;
  }
}
</style>

</head>
<body>
<main class="app">
  <section class="top">
    <div class="side playerSide">
      <h2>👤 JOGADOR</h2><div><div class="label">CRÉDITOS</div><div class="credit" id="playerCredit">10.000</div><input class="hiddenInput" id="addPlayer" type="number" min="1" placeholder="Adicionar créditos"><button class="addBtn" onclick="addCredit('player')">+ CRÉDITOS</button></div>
    </div>
    <div class="brand"><div class="title">BACATELA</div><div class="tagline">★★★ MAIOR NÚMERO GANHA! ★★★</div></div>
    <div class="side bankSide">
      <h2>🏦 BANCA</h2><div><div class="label">CRÉDITOS</div><div class="credit" id="bankCredit">10.000</div><input class="hiddenInput" id="addBank" type="number" min="1" placeholder="Adicionar créditos"><button class="addBtn" onclick="addCredit('bank')">+ CRÉDITOS</button></div>
    </div>
  </section>

  <section class="resultWrap">
    <div class="resultBox player" id="playerResultBox"><div class="resultTitle" id="playerResultTitle">JOGADOR</div><div class="bigNumber" id="playerNumber">—</div></div>
    <div class="versus">X</div>
    <div class="resultBox bank" id="bankResultBox"><div class="resultTitle" id="bankResultTitle">BANCA</div><div class="bigNumber" id="bankNumber">—</div></div>
  </section>

  <section class="centerGrid">
    <aside class="betPanel">
      <h3>VALOR DA APOSTA</h3>
      <div class="betRow"><button onclick="changeBet(-10)">−</button><input class="betValue" id="bet" type="number" min="1" value="100"><button onclick="changeBet(10)">+</button></div>
      <h3 style="margin-top:12px">APOSTA RÁPIDA</h3>
      <div class="quick"><button onclick="setBet(10)">10</button><button onclick="setBet(50)">50</button><button onclick="setBet(100)">100</button><button onclick="setBet(500)">500</button><button onclick="setBet(1000)">1000</button></div>
    </aside>

    <div class="centerBoard">
      <div class="numbers" id="numbers"></div>
      <section class="playBar">
        <button class="smallAction" id="newRound">↻ NOVA RODADA</button>
        <button class="play" id="playBtn">🎲 JOGAR RODADA 🎲<br><span style="font-size:13px">CLIQUE PARA JOGAR</span></button>
        <button class="sound" id="shuffleBtn">🔀 EMBARALHAR</button>
      </section>
    </div>

    <aside class="historyPanel">
      <h3>HISTÓRICO DAS RODADAS</h3><div class="historyList" id="history">Nenhuma rodada ainda.</div>
    </aside>
  </section>
  <div class="msg" id="msg">Escolha o valor da aposta fictícia e toque em JOGAR RODADA.</div>
  <div class="footer">⚠ JOGO FICTÍCIO — SEM DINHEIRO REAL ⚠</div>
</main>
<script>
const $=id=>document.getElementById(id),K='bacatelaVisualV2';
let state={player:10000,bank:10000,nums:[],history:[],playerWins:0,bankWins:0,lastPlayer:null,lastBank:null,lastWinner:null};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function freshNums(){return shuffle(Array.from({length:100},(_,i)=>i+1))}
function load(){try{const x=JSON.parse(localStorage.getItem(K)||'null');if(x&&Array.isArray(x.nums))state={...state,...x}}catch{}if(!state.nums.length)state.nums=freshNums()}
function save(){localStorage.setItem(K,JSON.stringify(state))}
function fmt(n){return Number(n||0).toLocaleString('pt-BR')}
function renderNumbers(){const p=state.lastPlayer,b=state.lastBank,w=state.lastWinner;$('numbers').innerHTML=state.nums.map(n=>{let c='num';if(n===p)c+=' playerMark';if(n===b)c+=' bankMark';if(w==='player'&&n===p)c+=' playerWin';if(w==='bank'&&n===b)c+=' bankWin';return `<div class="${c}">${n}</div>`}).join('')}
function renderHistory(){if(!state.history.length){$('history').innerHTML='Nenhuma rodada ainda.';return}$('history').innerHTML=state.history.slice(0,12).map(h=>`<div class="histItem ${h.winner==='player'?'histP':'histB'}"><div class="histNum">${h.winNum}</div><div>${h.winner==='player'?'JOGADOR':'BANCA'}</div><div>GANHOU</div></div>`).join('')}
function render(){ $('playerCredit').textContent=fmt(state.player);$('bankCredit').textContent=fmt(state.bank);$('playerNumber').textContent=state.lastPlayer??'—';$('bankNumber').textContent=state.lastBank??'—';$('playerResultBox').classList.toggle('winner',state.lastWinner==='player');$('bankResultBox').classList.toggle('winner',state.lastWinner==='bank');$('playerResultTitle').textContent=state.lastWinner==='player'?'JOGADOR GANHOU!':'JOGADOR';$('bankResultTitle').textContent=state.lastWinner==='bank'?'BANCA GANHOU!':'BANCA';renderNumbers();renderHistory();save()}
function setBet(v){$('bet').value=v}window.setBet=setBet;function changeBet(d){$('bet').value=Math.max(1,Math.floor(Number($('bet').value)||0)+d)}window.changeBet=changeBet;function maxBet(){$('bet').value=Math.max(1,Math.min(state.player,state.bank))}window.maxBet=maxBet;
function addCredit(who){const id=who==='player'?'addPlayer':'addBank',v=Math.floor(Number($(id).value));if(!v||v<1)return alert('Informe uma quantidade de créditos.');state[who]+=v;$(id).value='';render()}window.addCredit=addCredit;
$('playBtn').onclick=()=>{const bet=Math.floor(Number($('bet').value));if(!bet||bet<1)return alert('Informe a aposta em créditos fictícios.');if(state.player<bet)return alert('O jogador não possui créditos fictícios suficientes.');if(state.bank<bet)return alert('A banca não possui créditos fictícios suficientes para cobrir a rodada.');let draw=shuffle([...state.nums]),pn=draw[0],bn=draw[1];while(bn===pn)bn=draw[Math.floor(Math.random()*draw.length)];state.lastPlayer=pn;state.lastBank=bn;if(pn>bn){state.player+=bet;state.bank-=bet;state.playerWins++;state.lastWinner='player';state.history.unshift({winner:'player',winNum:pn,pn,bn,bet});$('msg').textContent=`🔵 JOGADOR GANHOU! ${pn} X ${bn} — +${fmt(bet)} créditos.`}else{state.player-=bet;state.bank+=bet;state.bankWins++;state.lastWinner='bank';state.history.unshift({winner:'bank',winNum:bn,pn,bn,bet});$('msg').textContent=`🔴 BANCA GANHOU! ${pn} X ${bn} — ${fmt(bet)} créditos para a banca.`}render()};
$('newRound').onclick=()=>{state.lastPlayer=null;state.lastBank=null;state.lastWinner=null;$('msg').textContent='Nova rodada pronta. Escolha a aposta e jogue.';render()};
$('shuffleBtn').onclick=()=>{state.nums=freshNums();state.lastPlayer=null;state.lastBank=null;state.lastWinner=null;$('msg').textContent='Os 100 números foram embaralhados.';render()};
load();render();
</script>
</body></html>
