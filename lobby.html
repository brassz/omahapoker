<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CLUBEDEJOGOSCAIPIRA — Lobby</title>
<link rel="stylesheet" href="css/theme-bacatela.css?v=11">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh}
.wrap{width:min(980px,100%);margin:0 auto;padding:14px 10px 28px}
.hero{text-align:center;padding:8px 6px 14px}
.club-logo{
  width:min(160px,40vw);height:auto;aspect-ratio:1;object-fit:contain;
  display:block;margin:0 auto 8px;
  animation:floaty 3.2s ease-in-out infinite, clubLogoNeon 2.8s ease-in-out infinite;
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.brand{
  margin:0;font-size:clamp(24px,6vw,48px);line-height:1.1;
  word-break:normal;overflow-wrap:normal;
}
.brand .brand-line{display:inline-block;white-space:nowrap}
.tag{margin:8px 0 0;font-size:clamp(14px,3.5vw,20px)}
.userbar{
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  margin:14px 0 16px;padding:12px;border-radius:16px;
  background:#0a0614;border:2px solid #17c8ff;
  box-shadow:0 0 14px #17c8ff88;
  animation:clubNeonGlow 1.6s ease-in-out infinite;
}
.userbar .user-meta{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;min-width:0
}
.userbar small{display:block;color:var(--muted);font-weight:800;font-size:12px;line-height:1.2}
.userbar strong{display:block;font-size:16px;line-height:1.2;font-weight:1000}
.userbar .saldo-line{
  color:#ffd91a;text-shadow:0 0 10px #ffd91a;font-weight:1000;font-size:13px
}
.userbar .actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.userbar button{
  border:0;border-radius:9px;padding:10px 14px;font-weight:900;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#b40000,#ff3434);border:2px solid #ff8a8a;
  box-shadow:0 0 12px #ff343455;animation:none!important;
}
.userbar button.wallet{
  color:#120018;
  background:linear-gradient(90deg,#17c8ff,#ffd91a,#5cff1a);
  border:2px solid #fff8;
}
.section-title{
  text-align:center;margin:0 0 12px;font-size:14px;font-weight:1000;
  letter-spacing:3px;color:#ff4fd8;
  animation:clubNeonBlink 2.4s ease-in-out infinite;
}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.game{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;min-height:180px;padding:16px 12px;text-decoration:none;color:#fff;
  border-radius:16px;border:2px solid #17c8ff;
  background:#0a0614;box-shadow:0 0 18px #17c8ff66;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  animation:rise .45s ease both, clubNeonGlow 1.6s ease-in-out infinite;
}
.game:nth-child(2){animation-delay:.05s,.1s}
.game:nth-child(3){animation-delay:.1s,.2s}
.game:nth-child(4){animation-delay:.15s,.3s}
.game:nth-child(5){animation-delay:.2s,.4s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.game:hover,.game:focus-visible{
  transform:translateY(-4px) scale(1.03);
  border-color:#7af0ff;box-shadow:0 0 28px #17c8ff,0 0 40px #00eaff;
  outline:none;
}
.game img{
  width:96px;height:96px;object-fit:contain;border-radius:16px;
  background:#080512;border:2px solid #17c8ff44;
  box-shadow:0 0 16px #17c8ff44;
}
.game .game-label{
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.game .game-label > span:first-child{
  font-weight:1000;font-size:18px;letter-spacing:2px;color:#ffd91a;
  animation:clubNeonBlink 2.8s ease-in-out infinite;
}
.game .launch-tag{
  font-size:11px;font-weight:1000;letter-spacing:3px;
  background:linear-gradient(90deg,#17c8ff,#ff4fd8,#ffd91a,#5cff1a,#ff8c15,#a78bfa,#17c8ff);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:clubRainbowShift 2s linear infinite;
  filter:drop-shadow(0 0 8px #ff4fd888);
}
.foot{
  margin-top:16px;text-align:center;font-size:11px;font-weight:800;
  color:#7af0ff;border-top:2px solid #17c8ff;padding-top:10px;
  text-shadow:0 0 10px #17c8ff88;
}
.loading{text-align:center;padding:40px 10px;font-weight:900;color:#ff4fd8;animation:clubNeonBlink 2.4s ease-in-out infinite}
.maint-banner{
  display:none;margin:0 0 14px;padding:14px 12px;text-align:center;font-weight:1000;
  color:#fff;background:#3b0218;border:2px solid #ff3434;border-radius:14px;
  box-shadow:0 0 18px #ff343488;letter-spacing:.4px;line-height:1.4;
}
.maint-banner.show{display:block}
.game.closed{
  opacity:.48;filter:grayscale(.75);pointer-events:none;cursor:not-allowed;
}
.game .closed-tag{
  font-size:11px;font-weight:1000;letter-spacing:2px;color:#ff6262;
}

.modal{
  display:none;position:fixed;inset:0;z-index:9999;padding:16px;
  background:#000a;align-items:center;justify-content:center;
}
.modal.open{display:flex}
.modal-card{
  width:min(420px,100%);background:#0a0614;border:2px solid #17c8ff;border-radius:18px;
  padding:18px 16px;box-shadow:0 0 28px #17c8ff88;animation:clubNeonGlow 1.6s ease-in-out infinite;
}
.modal-card h2{margin:0 0 6px;text-align:center;font-size:22px}
.modal-card .balance{
  text-align:center;font-size:28px;font-weight:1000;color:#ffd91a;
  text-shadow:0 0 12px #ffd91a;margin:8px 0 14px;
}
.modal-card label{display:block;font-size:12px;font-weight:900;color:#d8e7ff;margin:10px 0 4px}
.modal-card input{
  width:100%;padding:12px;border-radius:10px;border:1px solid #445;
  background:#090614;color:#fff;font-weight:800;font-size:15px;
}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.modal-actions button{
  border:0;border-radius:10px;padding:12px;font-weight:900;cursor:pointer;color:#fff;
}
.modal-actions .primary{
  color:#120018;background:linear-gradient(90deg,#17c8ff,#5cff1a);border:2px solid #fff8;
}
.modal-actions .ghost{background:#1a2233;border:2px solid #445}
.modal-msg{min-height:40px;margin-top:10px;text-align:center;font-size:13px;font-weight:800;color:#d8e7ff;line-height:1.4}
.modal-msg.ok{color:#5cff1a}.modal-msg.err{color:#ff6262}
.wd-list{margin-top:12px;max-height:140px;overflow:auto;font-size:12px;color:#d8e7ff}
.wd-item{padding:6px 0;border-bottom:1px solid #263042;font-weight:700}
.wd-item b{color:#ffd91a}
.wallet-btns{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:4px}
.wallet-btns button{
  width:100%;border:0;border-radius:10px;padding:12px;font-weight:900;cursor:pointer;
}
.wallet-btns .add{
  color:#041;background:linear-gradient(90deg,#1f7a00,#58df00);border:2px solid #9dff76;
}
.wallet-btns .out{
  color:#120018;background:linear-gradient(90deg,#17c8ff,#ffd91a);border:2px solid #fff8;
}
.pix-box{
  margin:12px 0;padding:12px;border-radius:12px;background:#060912;border:1px solid #334;
  text-align:center;
}
.pix-box .pix-label{font-size:11px;font-weight:900;color:#7af0ff;letter-spacing:1px}
.pix-box .pix-key{
  margin:8px 0 4px;font-size:18px;font-weight:1000;color:#ffd91a;
  text-shadow:0 0 10px #ffd91a66;word-break:break-all;
}
.pix-box .pix-company{font-size:13px;font-weight:800;color:#d8e7ff;line-height:1.35}
.pix-box .pix-copy{
  margin-top:10px;width:100%;border:0;border-radius:10px;padding:10px;font-weight:900;cursor:pointer;
  color:#00131b;background:linear-gradient(180deg,#0284c7,#17c8ff);border:2px solid #7dd3fc;
}
.wa-btn{
  width:100%;border:0;border-radius:10px;padding:13px;font-weight:900;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#128C7E,#25D366);border:2px solid #8ef0b5;
  box-shadow:0 0 14px #25D36655;font-size:14px;
}
.deposit-hint{font-size:12px;font-weight:700;color:#a9b7c6;text-align:center;line-height:1.4;margin:10px 0}
</style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="loading" id="loading">Validando sessão...</div>
  </div>

  <div class="modal" id="walletModal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-labelledby="walletTitle">
      <h2 id="walletTitle" class="club-rainbow">CARTEIRA</h2>
      <div style="text-align:center;font-size:12px;font-weight:800;color:#7af0ff">Seu saldo disponível</div>
      <div class="balance" id="walletBalance">0</div>

      <div class="wallet-btns">
        <button type="button" class="add" id="btnShowDeposit">ADICIONAR SALDO</button>
        <button type="button" class="out" id="btnShowWithdraw">SOLICITAR SAQUE</button>
      </div>

      <div id="depositForm" style="display:none">
        <p class="deposit-hint">Faça o PIX e envie o comprovante no WhatsApp para liberar o saldo.</p>
        <div class="pix-box">
          <div class="pix-label">CHAVE PIX · CNPJ</div>
          <div class="pix-key" id="depositPixKey">60.495.244/0001-14</div>
          <div class="pix-company" id="depositCompany">Af Capel Serviços de Cobrança Ltda</div>
          <button type="button" class="pix-copy" id="depositCopyPix">COPIAR CHAVE PIX</button>
        </div>
        <button type="button" class="wa-btn" id="depositWhatsApp">ENVIAR COMPROVANTE NO WHATSAPP</button>
        <div class="modal-actions">
          <button type="button" class="ghost" id="depositCancel" style="grid-column:1/-1">VOLTAR</button>
        </div>
      </div>

      <div id="withdrawForm" style="display:none">
        <label for="wdAmount">Valor do saque</label>
        <input id="wdAmount" type="number" min="2" step="1" placeholder="Ex: 100">
        <label for="wdPix">Chave PIX</label>
        <input id="wdPix" type="text" maxlength="120" placeholder="CPF, e-mail, telefone ou chave aleatória">
        <div class="modal-actions">
          <button type="button" class="ghost" id="wdCancel">CANCELAR</button>
          <button type="button" class="primary" id="wdSubmit">SOLICITAR</button>
        </div>
      </div>

      <div class="modal-msg" id="walletMsg"></div>
      <div class="wd-list" id="wdHistory"></div>
      <button type="button" id="walletClose" style="width:100%;margin-top:10px;border:0;border-radius:10px;padding:11px;font-weight:900;cursor:pointer;color:#fff;background:#334;border:2px solid #556">FECHAR</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=7"></script>
  <script src="js/auth.js?v=14"></script>
  <script>
  const GAMES = [
    { id: 'omaha', name: 'OMAHA5', href: 'jogos/omaha.html' },
    { id: 'crep', name: 'CREP', href: 'jogos/crep.html' },
    { id: 'bacatela', name: 'BACATELA', href: 'jogos/bagatela.html', launch: true },
    { id: 'chuvadepremios', name: 'CHUVA DE PRÊMIOS', href: 'jogos/chuvadepremios.html', launch: true },
    { id: 'roleta', name: 'ROLETA', href: 'jogos/roleta.html', launch: true },
    { id: 'flyx', name: 'FLYX', href: 'jogos/flyx.html', launch: true },
    { id: 'ronda', name: 'RONDA', href: 'jogos/ronda.html' },
    { id: 'caipira', name: 'CAIPIRA', href: 'jogos/caipira.html' },
    { id: '21', name: '21', href: 'jogos/21.html' },
  ];

  let currentCredits = 0;
  let currentUser = null;
  let currentProfile = null;
  let siteMaintenance = false;

  const DEPOSIT = window.CLUB_DEPOSIT || {
    pixKey: '60.495.244/0001-14',
    pixType: 'CNPJ',
    company: 'Af Capel Serviços de Cobrança Ltda',
    whatsapp: '5516992954354',
  };

  function logoImg(id, className) {
    return `<img class="${className || ''}" src="assets/logos/${id}.png" alt="${id}" onerror="this.onerror=null;this.src='assets/logos/${id}.svg'">`;
  }
  function fmt(n){ return Number(n || 0).toLocaleString('pt-BR'); }
  function setWalletMsg(text, type='') {
    const el = document.getElementById('walletMsg');
    el.textContent = text;
    el.className = 'modal-msg ' + type;
  }
  function statusLabel(s){
    if(s==='pending') return 'PENDENTE';
    if(s==='paid') return 'PAGO';
    if(s==='rejected') return 'RECUSADO';
    return s;
  }

  function resetWalletPanels() {
    document.getElementById('depositForm').style.display = 'none';
    document.getElementById('withdrawForm').style.display = 'none';
    document.querySelector('.wallet-btns').style.display = '';
  }

  function fillDepositInfo() {
    document.getElementById('depositPixKey').textContent = DEPOSIT.pixKey;
    document.getElementById('depositCompany').textContent = DEPOSIT.company;
  }

  async function refreshWallet() {
    if (!currentUser) return;
    const profile = await omahaAuth.getProfile(currentUser.id);
    currentProfile = profile;
    currentCredits = Number(profile?.player_credits || 0);
    document.getElementById('walletBalance').textContent = fmt(currentCredits);
    const saldoLine = document.getElementById('saldoLine');
    if (saldoLine) saldoLine.textContent = 'SALDO: ' + fmt(currentCredits);

    try {
      const list = await omahaAuth.listMyWithdrawals();
      const box = document.getElementById('wdHistory');
      if (!list.length) {
        box.innerHTML = '<div class="wd-item">Nenhum saque ainda.</div>';
      } else {
        box.innerHTML = list.slice(0, 8).map((w) =>
          `<div class="wd-item"><b>${fmt(w.amount)}</b> · ${statusLabel(w.status)} · PIX: ${w.pix_key}</div>`
        ).join('');
      }
    } catch (_) {
      document.getElementById('wdHistory').innerHTML = '';
    }
  }

  function openWallet() {
    resetWalletPanels();
    setWalletMsg('');
    fillDepositInfo();
    document.getElementById('walletModal').classList.add('open');
    document.getElementById('walletModal').setAttribute('aria-hidden', 'false');
    refreshWallet().catch(() => {});
  }
  function closeWallet() {
    document.getElementById('walletModal').classList.remove('open');
    document.getElementById('walletModal').setAttribute('aria-hidden', 'true');
  }

  async function boot() {
    currentUser = await omahaAuth.requireUser('login.html');
    if (!currentUser) return;

    let profile = null;
    try { profile = await omahaAuth.ensureProfile(currentUser); } catch (_) {}
    currentProfile = profile;

    const name = profile?.display_name || currentUser.email || 'Jogador';
    currentCredits = Number(profile?.player_credits || 0);
    const credits = fmt(currentCredits);
    const adminBtn = omahaAuth.isAdmin(profile)
      ? `<button type="button" id="adminBtn" style="background:linear-gradient(180deg,#6726d9,#331173);border:2px solid #a65eff">ADMIN</button>`
      : '';

    document.getElementById('app').innerHTML = `
      <header class="hero">
        ${logoImg('club', 'club-logo')}
        <h1 class="brand club-rainbow"><span class="brand-line">CLUBEDEJOGOS</span><span class="brand-line">CAIPIRA</span></h1>
        <p class="tag">Escolha um jogo</p>
      </header>

      <section class="userbar">
        <div class="user-meta">
          <small>LOGADO COMO</small>
          <strong id="userName">${name}</strong>
          <small class="saldo-line" id="saldoLine">SALDO: ${credits}</small>
        </div>
        <div class="actions">
          <button type="button" class="wallet" id="walletBtn">CARTEIRA</button>
          ${adminBtn}
          <button type="button" id="logoutBtn">SAIR</button>
        </div>
      </section>

      <div class="maint-banner" id="maintBanner">SITE EM MANUTENÇÃO — todos os jogos estão fechados.</div>
      <h2 class="section-title">★ SALAS DE JOGO ★</h2>
      <nav class="grid" id="gamesGrid" aria-label="Lista de jogos"></nav>
      <p class="foot">ADICIONE SALDO PELA CARTEIRA · PIX</p>
    `;

    const adminEl = document.getElementById('adminBtn');
    if (adminEl) adminEl.onclick = () => location.href = 'admin.html';
    document.getElementById('walletBtn').onclick = openWallet;
    document.getElementById('logoutBtn').onclick = async () => {
      try { await omahaAuth.signOut(); } catch (_) {}
      location.replace('login.html');
    };

    await syncMaintenance();
    setInterval(syncMaintenance, 8000);
  }

  function gamesMarkup(closed) {
    return GAMES.map((g) => {
      const inner = `
        ${logoImg(g.id)}
        <span class="game-label">
          <span>${g.name}</span>
          ${closed ? '<span class="closed-tag">FECHADO</span>' : (g.launch ? '<span class="launch-tag">LANÇAMENTO</span>' : '')}
        </span>
      `;
      if (closed) {
        return `<div class="game closed" aria-disabled="true">${inner}</div>`;
      }
      return `<a class="game" href="${g.href}" aria-label="Abrir ${g.name}">${inner}</a>`;
    }).join('');
  }

  function renderGames(closed) {
    siteMaintenance = !!closed;
    const banner = document.getElementById('maintBanner');
    const grid = document.getElementById('gamesGrid');
    const tag = document.querySelector('.hero .tag');
    if (banner) banner.classList.toggle('show', closed);
    if (grid) grid.innerHTML = gamesMarkup(closed);
    if (tag) tag.textContent = closed ? 'Site em manutenção' : 'Escolha um jogo';
  }

  async function syncMaintenance() {
    try {
      const s = await omahaAuth.getGameSettings();
      const on = omahaAuth.isMaintenance(s);
      if (on !== siteMaintenance || !document.getElementById('gamesGrid')?.children.length) {
        renderGames(on);
      }
    } catch (_) {}
  }

  document.getElementById('walletClose').onclick = closeWallet;
  document.getElementById('walletModal').addEventListener('click', (e) => {
    if (e.target.id === 'walletModal') closeWallet();
  });

  document.getElementById('btnShowDeposit').onclick = () => {
    document.querySelector('.wallet-btns').style.display = 'none';
    document.getElementById('withdrawForm').style.display = 'none';
    document.getElementById('depositForm').style.display = '';
    fillDepositInfo();
    setWalletMsg('Copie a chave PIX, pague e envie o comprovante no WhatsApp.');
  };
  document.getElementById('depositCancel').onclick = () => {
    resetWalletPanels();
    setWalletMsg('');
  };
  document.getElementById('depositCopyPix').onclick = async () => {
    const key = DEPOSIT.pixKey;
    try {
      await navigator.clipboard.writeText(key.replace(/\D/g, '') || key);
      setWalletMsg('Chave PIX copiada! Cole no app do banco.', 'ok');
    } catch (_) {
      setWalletMsg('Não foi possível copiar. Selecione a chave manualmente.', 'err');
    }
  };
  document.getElementById('depositWhatsApp').onclick = () => {
    const phone = String(DEPOSIT.whatsapp || '').replace(/\D/g, '');
    if (phone.length < 12) {
      setWalletMsg('Número do WhatsApp não configurado. Ajuste em js/config.js (CLUB_DEPOSIT.whatsapp).', 'err');
      return;
    }
    const nome = currentProfile?.display_name || currentUser?.email || 'Jogador';
    const msg = [
      'Olá! Quero adicionar saldo no CLUBEDEJOGOSCAIPIRA.',
      `Jogador: ${nome}`,
      `PIX pago para CNPJ ${DEPOSIT.pixKey}`,
      `Beneficiário: ${DEPOSIT.company}`,
      'Vou anexar o comprovante nesta conversa.',
    ].join('\n');
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank', 'noopener,noreferrer');
  };

  document.getElementById('btnShowWithdraw').onclick = () => {
    document.querySelector('.wallet-btns').style.display = 'none';
    document.getElementById('depositForm').style.display = 'none';
    document.getElementById('withdrawForm').style.display = '';
    setWalletMsg('Informe o valor e a chave PIX para solicitar o saque.');
  };
  document.getElementById('wdCancel').onclick = () => {
    resetWalletPanels();
    setWalletMsg('');
  };
  document.getElementById('wdSubmit').onclick = async () => {
    const amount = Math.floor(Number(document.getElementById('wdAmount').value));
    const pix = (document.getElementById('wdPix').value || '').trim();
    const btn = document.getElementById('wdSubmit');
    if (!(amount >= 2)) {
      setWalletMsg('Valor mínimo de saque: 2.', 'err');
      return;
    }
    if (amount > currentCredits) {
      setWalletMsg('Saldo insuficiente.', 'err');
      return;
    }
    if (pix.length < 5) {
      setWalletMsg('Informe uma chave PIX válida.', 'err');
      return;
    }
    btn.disabled = true;
    try {
      await omahaAuth.requestWithdrawal(amount, pix);
      document.getElementById('wdAmount').value = '';
      document.getElementById('wdPix').value = '';
      resetWalletPanels();
      setWalletMsg('Solicitação enviada! O prazo de pagamento é de até 2 horas.', 'ok');
      await refreshWallet();
    } catch (err) {
      setWalletMsg(err?.message || 'Falha ao solicitar saque. Rode o SQL withdrawals.sql no Supabase.', 'err');
    } finally {
      btn.disabled = false;
    }
  };

  boot().catch(() => location.replace('login.html'));
  </script>
</body>
</html>
